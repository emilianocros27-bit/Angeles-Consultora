<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;700&family=Noto+Serif:ital,wght@0,600;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="logo">
    <span class="mark">Ángeles</span>
    <span class="sub">Consultora</span>
  </div>
  <nav class="main-nav">
    <a href="index.html">Inicio</a>
    <a href="catalogo.html" class="active">Catálogo</a>
    <a href="index.html#contacto">Contacto</a>
  </nav>
  <a class="btn-whatsapp" href="https://wa.me/5212281542154" target="_blank" rel="noopener">
    Escríbeme
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
</header>

<div class="catalog-head">
  <span class="eyebrow">Mary Kay — The Look, Julio-Agosto 2026</span>
  <h1 class="serif">Catálogo completo</h1>
</div>

<div class="flipbook" id="flipbook">
  <button class="flip-arrow flip-prev" id="prevBtn" aria-label="Página anterior">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>

  <div class="flip-page">
    <img id="pageImg" src="img/catalogo/pagina-01.jpg" alt="Página 1">
  </div>

  <button class="flip-arrow flip-next" id="nextBtn" aria-label="Página siguiente">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<div class="flip-controls">
  <span id="pageCounter">Página 1 / 76</span>
  <input type="range" id="pageSlider" min="1" max="76" value="1">
</div>

<section class="contact-band">
  <a href="https://wa.me/5212281542154" target="_blank" rel="noopener">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    ¿Viste algo que te gustó? Pedilo — 2281542154
  </a>
</section>

<footer class="site-footer">
  <div class="logo">
    <span class="mark">Ángeles</span>
    <span class="sub">Consultora · [NOMBRE]</span>
  </div>
  <span>© 2026 Ángeles Consultora</span>
</footer>

<script>
const TOTAL_PAGES = 76;
let current = 1;
const img = document.getElementById('pageImg');
const counter = document.getElementById('pageCounter');
const slider = document.getElementById('pageSlider');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function pad(n) { return String(n).padStart(2, '0'); }

function preload(n) {
  if (n < 1 || n > TOTAL_PAGES) return;
  const p = new Image();
  p.src = `img/catalogo/pagina-${pad(n)}.jpg`;
}

function render() {
  img.src = `img/catalogo/pagina-${pad(current)}.jpg`;
  img.alt = `Página ${current}`;
  counter.textContent = `Página ${current} / ${TOTAL_PAGES}`;
  slider.value = current;
  prevBtn.disabled = current === 1;
  nextBtn.disabled = current === TOTAL_PAGES;
  preload(current + 1);
  preload(current - 1);
}

function goTo(n) {
  current = Math.min(TOTAL_PAGES, Math.max(1, n));
  render();
}

prevBtn.addEventListener('click', () => goTo(current - 1));
nextBtn.addEventListener('click', () => goTo(current + 1));
slider.addEventListener('input', () => goTo(parseInt(slider.value, 10)));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') goTo(current + 1);
  if (e.key === 'ArrowLeft') goTo(current - 1);
});

let touchStartX = null;
const flipPage = document.querySelector('.flip-page');
flipPage.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
flipPage.addEventListener('touchend', (e) => {
  if (touchStartX === null) return;
  const dx = e.changedTouches[0].clientX - touchStartX;
  if (Math.abs(dx) > 40) goTo(dx < 0 ? current + 1 : current - 1);
  touchStartX = null;
});

render();
</script>

</body>
</html>
